<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 585" role="img" aria-label="Injection techniques and planes"><rect width="860" height="585" fill="#fff"/><text x="430.0" y="28" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#3B2230">Injection techniques and planes</text><rect x="20" y="50" width="400" height="230" rx="14" fill="#fff" stroke="#E6D9CC"/><text x="220" y="74" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#3B2230">Linear threading (retrograde)</text><rect x="40" y="90" width="360" height="22" fill="#F3D6C2" stroke="#3B2230"/><rect x="40" y="112" width="360" height="60" fill="#F8E7A6" stroke="#3B2230"/><rect x="40" y="172" width="360" height="30" fill="#C98A8A" stroke="#3B2230"/><rect x="40" y="202" width="360" height="28" fill="#E9E1D3" stroke="#3B2230"/><text x="50" y="105" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Dermis</text><text x="50" y="148" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Subcutaneous fat</text><text x="50" y="191" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Muscle</text><text x="50" y="220" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Bone</text><line x1="320" y1="140" x2="130" y2="140" stroke="#3E5E9A" stroke-width="6" stroke-linecap="round" opacity=".7"/><polygon points="320,140 360,104 366,110" fill="#9aa"/><text x="225" y="166" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#241C20">fill as the needle withdraws</text><text x="220" y="255" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#5E5257">Folds, lines, lips, jawline</text><rect x="440" y="50" width="400" height="230" rx="14" fill="#fff" stroke="#E6D9CC"/><text x="640" y="74" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#3B2230">Fanning</text><rect x="460" y="90" width="360" height="22" fill="#F3D6C2" stroke="#3B2230"/><rect x="460" y="112" width="360" height="60" fill="#F8E7A6" stroke="#3B2230"/><rect x="460" y="172" width="360" height="30" fill="#C98A8A" stroke="#3B2230"/><rect x="460" y="202" width="360" height="28" fill="#E9E1D3" stroke="#3B2230"/><text x="470" y="105" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Dermis</text><text x="470" y="148" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Subcutaneous fat</text><text x="470" y="191" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Muscle</text><text x="470" y="220" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Bone</text><line x1="740" y1="142" x2="590" y2="126" stroke="#3E5E9A" stroke-width="4" stroke-linecap="round" opacity=".7"/><line x1="740" y1="142" x2="620" y2="132" stroke="#3E5E9A" stroke-width="4" stroke-linecap="round" opacity=".7"/><line x1="740" y1="142" x2="650" y2="138" stroke="#3E5E9A" stroke-width="4" stroke-linecap="round" opacity=".7"/><line x1="740" y1="142" x2="680" y2="144" stroke="#3E5E9A" stroke-width="4" stroke-linecap="round" opacity=".7"/><line x1="740" y1="142" x2="710" y2="150" stroke="#3E5E9A" stroke-width="4" stroke-linecap="round" opacity=".7"/><polygon points="740,142 780,106 786,112" fill="#9aa"/><text x="640" y="255" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#5E5257">Larger areas from one entry point</text><rect x="20" y="300" width="400" height="230" rx="14" fill="#fff" stroke="#E6D9CC"/><text x="220" y="324" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#3B2230">Serial puncture</text><rect x="40" y="340" width="360" height="22" fill="#F3D6C2" stroke="#3B2230"/><rect x="40" y="362" width="360" height="60" fill="#F8E7A6" stroke="#3B2230"/><rect x="40" y="422" width="360" height="30" fill="#C98A8A" stroke="#3B2230"/><rect x="40" y="452" width="360" height="28" fill="#E9E1D3" stroke="#3B2230"/><text x="50" y="355" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Dermis</text><text x="50" y="398" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Subcutaneous fat</text><text x="50" y="441" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Muscle</text><text x="50" y="470" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Bone</text><circle cx="130" cy="351" r="6" fill="#3E5E9A" opacity=".8"/><circle cx="175" cy="351" r="6" fill="#3E5E9A" opacity=".8"/><circle cx="220" cy="351" r="6" fill="#3E5E9A" opacity=".8"/><circle cx="265" cy="351" r="6" fill="#3E5E9A" opacity=".8"/><circle cx="310" cy="351" r="6" fill="#3E5E9A" opacity=".8"/><text x="220" y="416" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#241C20">small aliquots, intradermal or deep dermal</text><text x="220" y="505" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#5E5257">Fine lines, lip border, skin boosters</text><rect x="440" y="300" width="400" height="230" rx="14" fill="#fff" stroke="#E6D9CC"/><text x="640" y="324" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#3B2230">Deep supraperiosteal bolus</text><rect x="460" y="340" width="360" height="22" fill="#F3D6C2" stroke="#3B2230"/><rect x="460" y="362" width="360" height="60" fill="#F8E7A6" stroke="#3B2230"/><rect x="460" y="422" width="360" height="30" fill="#C98A8A" stroke="#3B2230"/><rect x="460" y="452" width="360" height="28" fill="#E9E1D3" stroke="#3B2230"/><text x="470" y="355" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Dermis</text><text x="470" y="398" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Subcutaneous fat</text><text x="470" y="441" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Muscle</text><text x="470" y="470" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#241C20">Bone</text><ellipse cx="640" cy="448" rx="30" ry="9" fill="#3E5E9A" opacity=".8"/><polygon points="640,448 634,390 646,390" fill="#9aa"/><rect x="632" y="366" width="16" height="26" fill="#ddd" stroke="#241C20"/><text x="640" y="505" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#5E5257">Structural support: chin, malar, jaw</text><text x="20" y="560" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#5E5257">Needle or cannula: a cannula limits entry points and bruising but does not remove intravascular risk. Inject slowly with low pressure and keep moving.</text></svg>