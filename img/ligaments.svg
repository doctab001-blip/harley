600" fill="#241C20">Mandibular ligament</text><line x1="135" y1="524" x2="382" y2="525" stroke="#5E5257" stroke-width="1.2"/><circle cx="382" cy="525" r="2.6" fill="#5E5257"/><text x="650" y="420" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#8E4B5A">Ligaments anchor skin</text><text x="650" y="438" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#8E4B5A">to the deeper layers.</text><text x="650" y="462" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">Where they hold and</text><text x="650" y="478" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">volume is lost, hollows</text><text x="650" y="494" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">and folds form.</text><text x="20" y="665" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#5E5257">Schematic front view, simplified. Positions are approximate and shown on the patient's right side only.</text></svg>