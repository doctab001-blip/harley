<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 643" role="img" aria-label="Consultation flow for injectable treatments"><rect width="860" height="643" fill="#fff"/><text x="430.0" y="28" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#3B2230">Consultation flow for injectable treatments</text><rect x="40" y="60" width="520" height="48" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="300.0" y="80.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">1  Welcome and aims</text><text x="300.0" y="96.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">What does the patient want, and why now?</text><line x1="300" y1="108" x2="300" y2="126" stroke="#3B2230" stroke-width="1.8"/><polygon points="300,126 295,117 305,117" fill="#3B2230" transform="rotate(0)"/><rect x="40" y="126" width="520" height="48" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="300.0" y="146.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">2  History and medicines</text><text x="300.0" y="162.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Allergies, anticoagulants, isotretinoin, pregnancy, autoimmune, cold sores</text><line x1="300" y1="174" x2="300" y2="192" stroke="#3B2230" stroke-width="1.8"/><polygon points="300,192 295,183 305,183" fill="#3B2230" transform="rotate(0)"/><rect x="40" y="192" width="520" height="48" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="300.0" y="212.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">3  Psychological screen</text><text x="300.0" y="228.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Expectations, BDD features, pressure from others, recent crisis</text><line x1="300" y1="240" x2="300" y2="258" stroke="#3B2230" stroke-width="1.8"/><polygon points="300,258 295,249 305,249" fill="#3B2230" transform="rotate(0)"/><rect x="40" y="258" width="520" height="48" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="300.0" y="278.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">4  Assess face and skin</text><text x="300.0" y="294.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Rest and animation, volume, lines, Fitzpatrick type, photographs</text><line x1="300" y1="306" x2="300" y2="324" stroke="#3B2230" stroke-width="1.8"/><polygon points="300,324 295,315 305,315" fill="#3B2230" transform="rotate(0)"/><rect x="40" y="324" width="520" height="48" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="300.0" y="344.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">5  Plan and options</text><text x="300.0" y="360.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Staged plan, alternatives, realistic outcome, risks, cost</text><line x1="300" y1="372" x2="300" y2="390" stroke="#3B2230" stroke-width="1.8"/><polygon points="300,390 295,381 305,381" fill="#3B2230" transform="rotate(0)"/><rect x="40" y="390" width="520" height="48" rx="10" fill="#F5ECDD" stroke="#B8935F" stroke-width="1.4"/><text x="300.0" y="410.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">6  Consent</text><text x="300.0" y="426.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">By you, in person, with time to consider, written record</text><line x1="300" y1="438" x2="300" y2="456" stroke="#3B2230" stroke-width="1.8"/><polygon points="300,456 295,447 305,447" fill="#3B2230" transform="rotate(0)"/><rect x="40" y="456" width="520" height="48" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="300.0" y="476.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">7  Treat and record</text><text x="300.0" y="492.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Product, batch, expiry, dose or volume, sites, technique</text><line x1="300" y1="504" x2="300" y2="522" stroke="#3B2230" stroke-width="1.8"/><polygon points="300,522 295,513 305,513" fill="#3B2230" transform="rotate(0)"/><rect x="40" y="522" width="520" height="48" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="300.0" y="542.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">8  Aftercare and follow-up</text><text x="300.0" y="558.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Written advice, review date, emergency contact</text><rect x="600" y="128" width="230" height="84" rx="10" fill="#fff" stroke="#B23A3A" stroke-width="1.4"/><text x="715.0" y="150.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#241C20">Pause, decline or delay</text><text x="715.0" y="166.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">if: BDD features, unrealistic</text><text x="715.0" y="182.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">goals, under 18, pressure,</text><text x="715.0" y="198.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">contraindication</text><line x1="560" y1="150" x2="600" y2="150" stroke="#3B2230" stroke-width="1.8"/><polygon points="600,150 591,145 591,155" fill="#3B2230"/><rect x="600" y="260" width="230" height="84" rx="10" fill="#fff" stroke="#B23A3A" stroke-width="1.4"/><text x="715.0" y="282.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#241C20">Refer or seek advice</text><text x="715.0" y="298.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">if: medical issue, unclear</text><text x="715.0" y="314.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">history, request outside</text><text x="715.0" y="330.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">your competence</text><text x="20" y="622" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#5E5257">Schematic of a safe consultation sequence. Adapt it to your own protocol and indemnity requirements.</text></svg>