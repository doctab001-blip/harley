<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 445" role="img" aria-label="Chemical peel depths and risk"><rect width="860" height="445" fill="#fff"/><text x="430.0" y="28" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#3B2230">Chemical peel depths and risk</text><rect x="60" y="90" width="260" height="50" fill="#E5BE9C" stroke="#3B2230"/><text x="70" y="119.0" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#241C20">Epidermis</text><rect x="60" y="140" width="260" height="50" fill="#F3D6C2" stroke="#3B2230"/><text x="70" y="169.0" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#241C20">Papillary dermis</text><rect x="60" y="190" width="260" height="60" fill="#F0C9B2" stroke="#3B2230"/><text x="70" y="224.0" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#241C20">Upper reticular dermis</text><rect x="60" y="250" width="260" height="90" fill="#E8B79C" stroke="#3B2230"/><text x="70" y="299.0" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#241C20">Mid to deep reticular dermis</text><line x1="320" y1="160" x2="360" y2="160" stroke="#3E5E9A" stroke-width="3"/><circle cx="320" cy="160" r="4" fill="#3E5E9A"/><text x="370" y="158" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#3E5E9A">Superficial peel</text><text x="370" y="176" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">Glycolic, salicylic, mandelic acids</text><line x1="320" y1="250" x2="360" y2="250" stroke="#B8935F" stroke-width="3"/><circle cx="320" cy="250" r="4" fill="#B8935F"/><text x="370" y="248" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#B8935F">Medium peel</text><text x="370" y="266" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">Trichloroacetic acid (TCA)</text><line x1="320" y1="340" x2="360" y2="340" stroke="#B23A3A" stroke-width="3"/><circle cx="320" cy="340" r="4" fill="#B23A3A"/><text x="370" y="338" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#B23A3A">Deep peel</text><text x="370" y="356" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">Phenol: specialist only</text><text x="60" y="70" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#5E5257">Depth of injury</text><line x1="640" y1="110" x2="640" y2="320" stroke="#8E4B5A" stroke-width="2"/><polygon points="640,330 634,316 646,316" fill="#8E4B5A"/><text x="650" y="170" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#8E4B5A">More risk</text><text x="650" y="188" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#8E4B5A">as depth</text><text x="650" y="206" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#8E4B5A">increases:</text><text x="650" y="226" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">PIH, scarring,</text><text x="650" y="244" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">infection, cold</text><text x="650" y="262" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="500" fill="#241C20">sore reactivation</text><text x="20" y="420" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#5E5257">Schematic. Depth depends on agent, strength, contact time and skin preparation. Types IV to VI need extra caution for pigment change.</text></svg>