<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-label="Suspected anaphylaxis: decision flow"><rect width="780" height="590" fill="#fff"/><text x="390.0" y="28" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#3B2230">Suspected anaphylaxis: decision flow</text><rect x="60" y="50" width="640" height="52" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="380.0" y="72.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">Recognise</text><text x="380.0" y="88.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Airway, breathing or circulation problem with skin or mucosal change</text><line x1="380" y1="102" x2="380" y2="120" stroke="#3B2230" stroke-width="1.8"/><polygon points="380,120 375,111 385,111" fill="#3B2230" transform="rotate(0)"/><rect x="60" y="120" width="640" height="52" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="380.0" y="142.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">Call 999</text><text x="380.0" y="158.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">State anaphylaxis, give your location</text><line x1="380" y1="172" x2="380" y2="190" stroke="#3B2230" stroke-width="1.8"/><polygon points="380,190 375,181 385,181" fill="#3B2230" transform="rotate(0)"/><rect x="60" y="190" width="640" height="52" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="380.0" y="212.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">Position</text><text x="380.0" y="228.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Lie flat with legs raised; sit up if breathing is the main problem</text><line x1="380" y1="242" x2="380" y2="260" stroke="#3B2230" stroke-width="1.8"/><polygon points="380,260 375,251 385,251" fill="#3B2230" transform="rotate(0)"/><rect x="60" y="260" width="640" height="52" rx="10" fill="#FBE3A8" stroke="#B8935F" stroke-width="1.4"/><text x="380.0" y="282.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">Adrenaline IM</text><text x="380.0" y="298.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Adult: 500 micrograms (0.5 mL of 1 mg/mL), anterolateral thigh</text><line x1="380" y1="312" x2="380" y2="330" stroke="#3B2230" stroke-width="1.8"/><polygon points="380,330 375,321 385,321" fill="#3B2230" transform="rotate(0)"/><rect x="60" y="330" width="640" height="52" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="380.0" y="352.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">Oxygen and monitor</text><text x="380.0" y="368.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">High-flow oxygen, pulse, blood pressure, breathing</text><line x1="380" y1="382" x2="380" y2="400" stroke="#3B2230" stroke-width="1.8"/><polygon points="380,400 375,391 385,391" fill="#3B2230" transform="rotate(0)"/><rect x="60" y="400" width="640" height="52" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="380.0" y="422.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">Repeat if no better</text><text x="380.0" y="438.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Repeat adrenaline after 5 minutes</text><line x1="380" y1="452" x2="380" y2="470" stroke="#3B2230" stroke-width="1.8"/><polygon points="380,470 375,461 385,461" fill="#3B2230" transform="rotate(0)"/><rect x="60" y="470" width="640" height="52" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="380.0" y="492.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">Handover and record</text><text x="380.0" y="508.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Document times and doses; antihistamine and steroid never replace adrenaline</text><text x="20" y="570" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#5E5257">Follow your resuscitation training and national guidance. Check the dose and route against the current Resuscitation Council UK algorithm.</text></svg>