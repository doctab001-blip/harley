<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 530" role="img" aria-label="Suspected vascular occlusion: decision flow"><rect width="890" height="530" fill="#fff"/><text x="445.0" y="28" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#3B2230">Suspected vascular occlusion: decision flow</text><rect x="240" y="50" width="380" height="46" rx="10" fill="#fff" stroke="#B23A3A" stroke-width="1.4"/><text x="430.0" y="69.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">STOP injecting</text><text x="430.0" y="85.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Act at once</text><line x1="430" y1="96" x2="430" y2="116" stroke="#3B2230" stroke-width="1.8"/><polygon points="430,116 425,107 435,107" fill="#3B2230" transform="rotate(0)"/><rect x="190" y="116" width="480" height="60" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="430.0" y="134.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">Recognise vascular occlusion</text><text x="430.0" y="150.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Disproportionate pain, blanching, mottling or livedo,</text><text x="430.0" y="166.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">delayed capillary refill; later dusky skin</text><line x1="430" y1="176" x2="430" y2="196" stroke="#3B2230" stroke-width="1.8"/><polygon points="430,196 425,187 435,187" fill="#3B2230" transform="rotate(0)"/><rect x="190" y="196" width="480" height="46" rx="10" fill="#F5ECDD" stroke="#B8935F" stroke-width="1.4"/><text x="430.0" y="215.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">Any visual symptom or neurological sign?</text><text x="430.0" y="231.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">(blurring, loss of vision, eye pain, double vision, headache)</text><line x1="670" y1="219" x2="720" y2="219" stroke="#3B2230" stroke-width="1.8"/><polygon points="720,219 711,214 711,224" fill="#3B2230"/><rect x="720" y="190" width="150" height="60" rx="10" fill="#fff" stroke="#B23A3A" stroke-width="1.4"/><text x="795.0" y="208.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#241C20">YES: emergency</text><text x="795.0" y="224.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11" font-weight="500" fill="#241C20">Immediate transfer,</text><text x="795.0" y="240.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11" font-weight="500" fill="#241C20">emergency eye care</text><line x1="430" y1="242" x2="430" y2="266" stroke="#3B2230" stroke-width="1.8"/><polygon points="430,266 425,257 435,257" fill="#3B2230" transform="rotate(0)"/><text x="440" y="258" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="11" font-weight="600" fill="#5E5257">No visual or neurological symptoms</text><rect x="190" y="266" width="480" height="76" rx="10" fill="#F4E1E0" stroke="#8E4B5A" stroke-width="1.4"/><text x="430.0" y="292.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">High-dose hyaluronidase across the whole territory</text><text x="430.0" y="308.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Repeat as your protocol states, warmth and gentle massage,</text><text x="430.0" y="324.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">reassess capillary refill and pain</text><line x1="430" y1="342" x2="430" y2="362" stroke="#3B2230" stroke-width="1.8"/><polygon points="430,362 425,353 435,353" fill="#3B2230" transform="rotate(0)"/><rect x="190" y="362" width="480" height="46" rx="10" fill="#F5ECDD" stroke="#B8935F" stroke-width="1.4"/><text x="430.0" y="381.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">Clear improvement?</text><text x="430.0" y="397.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Colour, refill and pain settling</text><line x1="670" y1="385" x2="720" y2="385" stroke="#3B2230" stroke-width="1.8"/><polygon points="720,385 711,380 711,390" fill="#3B2230"/><rect x="720" y="360" width="150" height="52" rx="10" fill="#E4ECE6" stroke="#566F60" stroke-width="1.4"/><text x="795.0" y="382.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#241C20">YES: review closely</text><text x="795.0" y="398.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11" font-weight="500" fill="#241C20">until resolved</text><line x1="430" y1="408" x2="430" y2="430" stroke="#3B2230" stroke-width="1.8"/><polygon points="430,430 425,421 435,421" fill="#3B2230" transform="rotate(0)"/><text x="440" y="424" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="11" font-weight="600" fill="#5E5257">NO or unsure</text><rect x="190" y="430" width="480" height="46" rx="10" fill="#fff" stroke="#B23A3A" stroke-width="1.4"/><text x="430.0" y="449.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#241C20">Escalate to hospital</text><text x="430.0" y="465.0" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="500" fill="#241C20">Do not wait: document timings, doses, photos</text><text x="20" y="505" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#5E5257">Always follow the protocol you were trained on and national guidance (for example ACE group guidance). Tell your indemnifier promptly.</text></svg>