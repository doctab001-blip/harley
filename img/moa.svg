<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 445" role="img" aria-label="How botulinum toxin blocks the neuromuscular junction"><rect width="860" height="445" fill="#fff"/><text x="430.0" y="28" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#3B2230">How botulinum toxin blocks the neuromuscular junction</text><rect x="20" y="60" width="400" height="330" rx="14" fill="#fff" stroke="#E6D9CC"/><text x="220" y="84" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#3B2230">Normal: nerve signal arrives</text><rect x="50" y="100" width="340" height="90" rx="30" fill="#F8E7A6" stroke="#3B2230" stroke-width="1.5"/><text x="220" y="122" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#241C20">Nerve terminal</text><circle cx="105" cy="150" r="14" fill="#C6DDF0" stroke="#3E5E9A"/><text x="105" y="154" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="9" font-weight="700" fill="#3E5E9A">ACh</text><circle cx="165" cy="150" r="14" fill="#C6DDF0" stroke="#3E5E9A"/><text x="165" y="154" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="9" font-weight="700" fill="#3E5E9A">ACh</text><circle cx="225" cy="150" r="14" fill="#C6DDF0" stroke="#3E5E9A"/><text x="225" y="154" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="9" font-weight="700" fill="#3E5E9A">ACh</text><circle cx="285" cy="150" r="14" fill="#C6DDF0" stroke="#3E5E9A"/><text x="285" y="154" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="9" font-weight="700" fill="#3E5E9A">ACh</text><line x1="50" y1="205" x2="390" y2="205" stroke="#3B2230" stroke-width="2" stroke-dasharray="2 0"/><text x="220" y="226" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11" font-weight="500" fill="#5E5257">Synaptic cleft</text><rect x="50" y="245" width="340" height="60" rx="14" fill="#C98A8A" stroke="#3B2230" stroke-width="1.5"/><text x="220" y="290" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#241C20">Muscle end-plate</text><rect x="96" y="239" width="18" height="12" rx="3" fill="#3E5E9A"/><rect x="156" y="239" width="18" height="12" rx="3" fill="#3E5E9A"/><rect x="216" y="239" width="18" height="12" rx="3" fill="#3E5E9A"/><rect x="276" y="239" width="18" height="12" rx="3" fill="#3E5E9A"/><text x="220" y="335" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#241C20">Vesicles fuse via SNARE proteins (incl. SNAP-25),</text><text x="220" y="352" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#241C20">ACh crosses the cleft, muscle contracts</text><line x1="105" y1="166" x2="105" y2="238" stroke="#3E5E9A" stroke-width="1.6" stroke-dasharray="3 3"/><line x1="165" y1="166" x2="165" y2="238" stroke="#3E5E9A" stroke-width="1.6" stroke-dasharray="3 3"/><line x1="225" y1="166" x2="225" y2="238" stroke="#3E5E9A" stroke-width="1.6" stroke-dasharray="3 3"/><line x1="285" y1="166" x2="285" y2="238" stroke="#3E5E9A" stroke-width="1.6" stroke-dasharray="3 3"/><rect x="440" y="60" width="400" height="330" rx="14" fill="#fff" stroke="#E6D9CC"/><text x="640" y="84" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#8E4B5A">After toxin: release blocked</text><rect x="470" y="100" width="340" height="90" rx="30" fill="#F8E7A6" stroke="#3B2230" stroke-width="1.5"/><text x="640" y="122" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#241C20">Nerve terminal</text><circle cx="525" cy="150" r="14" fill="#C6DDF0" stroke="#3E5E9A"/><text x="525" y="154" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="9" font-weight="700" fill="#3E5E9A">ACh</text><circle cx="585" cy="150" r="14" fill="#C6DDF0" stroke="#3E5E9A"/><text x="585" y="154" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="9" font-weight="700" fill="#3E5E9A">ACh</text><circle cx="645" cy="150" r="14" fill="#C6DDF0" stroke="#3E5E9A"/><text x="645" y="154" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="9" font-weight="700" fill="#3E5E9A">ACh</text><circle cx="705" cy="150" r="14" fill="#C6DDF0" stroke="#3E5E9A"/><text x="705" y="154" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="9" font-weight="700" fill="#3E5E9A">ACh</text><line x1="470" y1="205" x2="810" y2="205" stroke="#3B2230" stroke-width="2" stroke-dasharray="2 0"/><text x="640" y="226" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11" font-weight="500" fill="#5E5257">Synaptic cleft</text><rect x="470" y="245" width="340" height="60" rx="14" fill="#C98A8A" stroke="#3B2230" stroke-width="1.5"/><text x="640" y="290" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#241C20">Muscle end-plate</text><rect x="516" y="239" width="18" height="12" rx="3" fill="#3E5E9A"/><rect x="576" y="239" width="18" height="12" rx="3" fill="#3E5E9A"/><rect x="636" y="239" width="18" height="12" rx="3" fill="#3E5E9A"/><rect x="696" y="239" width="18" height="12" rx="3" fill="#3E5E9A"/><text x="640" y="335" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#B23A3A">SNAP-25 cleaved by toxin A: vesicles cannot fuse,</text><text x="640" y="352" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#B23A3A">no acetylcholine released, muscle relaxes</text><rect x="500" y="190" width="280" height="10" fill="#fff"/><path d="M560 196 L580 210 M580 196 L560 210" stroke="#B23A3A" stroke-width="3"/><text x="20" y="420" text-anchor="start" font-family="DM Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#5E5257">Schematic only. Cosmetic effect is reversible: the nerve terminal recovers, which is why treatment wears off in about 3 to 4 months.</text></svg>